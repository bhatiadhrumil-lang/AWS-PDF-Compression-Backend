# AWS CodeBuild buildspec — PDF Compression Backend.
#
# Pipeline design (Phase 2A):
#   GitHub (main) -> CodePipeline -> CodeBuild (this file) -> tests ->
#   Docker build -> ECR push (latest + commit SHA) -> [later: Lambda update]
#
# Project requirements (set on the CodeBuild project, not here):
#   * Linux image: aws/codebuild/amazonlinux2-x86_64-standard:5.0 (or newer 3.x
#     standard with Python 3.11+ and Docker 20+).
#   * Privileged mode: ON (docker build needs the Docker daemon).
#   * No AWS credentials needed for the test stage (all AWS calls mocked).
#   * CodeBuild service role needs ECR push rights on the pdf-compressor
#     repository (ecr:GetAuthorizationToken + Push actions). The role's
#     temporary credentials are used automatically — no keys in this file.
#
# This buildspec pushes images to ECR but does NOT touch Lambda.
# Lambda deployment stays manual until the pipeline's deploy stage is approved.
version: 0.2

env:
  variables:
    IMAGE_TAG: "latest"
    IMAGE_REPO: "pdf-compressor"
    # Phase 2A: ECR publishing target. Values are public identifiers
    # (account ID, region, repo name) — never credentials.
    AWS_ACCOUNT_ID: "868942372673"
    AWS_REGION: "us-east-2"

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - python3 --version
      - docker --version
      # Install runtime deps so the FULL suite runs (pypdf-gated tests
      # would otherwise skip and the build would under-test the code).
      - python3 -m pip install --upgrade pip
      - python3 -m pip install -r requirements.txt

  pre_build:
    commands:
      - echo "Running backend unit tests..."
      - python3 -m unittest discover -s tests -v
      - echo "Running Python syntax checks..."
      - >-
        python3 -m py_compile src/app.py src/handler.py src/config.py
        src/operations/compress.py src/operations/merge.py
        src/operations/split.py src/operations/rotate.py
        src/operations/delete_pages.py src/operations/extract.py
        src/operations/edit.py src/operations/jpg_to_pdf.py src/common/*.py
      - echo "Tests and syntax checks passed."

  build:
    commands:
      - echo "Building Docker image ${IMAGE_REPO}:${IMAGE_TAG} (ECR push happens in post_build)..."
      - docker build -t "${IMAGE_REPO}:${IMAGE_TAG}" .
      - docker images "${IMAGE_REPO}:${IMAGE_TAG}"
      # Smoke test: the image must contain the operations and shared parser.
      - >-
        docker run --rm --entrypoint python "${IMAGE_REPO}:${IMAGE_TAG}" -c
        "from operations import compress, merge, split, rotate, delete_pages, extract, edit, jpg_to_pdf;
        from common import page_ranges, filenames;
        from common.filenames import delete_output_key_for, jpg_to_pdf_output_key_for;
        print(delete_output_key_for('doc', 'delete-requests/req-1.delete.json'));
        print(jpg_to_pdf_output_key_for('photo.jpg', 'jpg-to-pdf-requests/req-1.jpg2pdf.json'));
        print('IMAGE-SMOKE-OK')"
      - echo "Docker build and smoke test passed."

  post_build:
    commands:
      # ---- Phase 2A: publish the tested image to Amazon ECR. ----
      # Auth uses the CodeBuild service role's temporary credentials
      # (no hard-coded keys). Any failing command below fails the build.
      - echo "Logging in to Amazon ECR..."
      - >-
        aws ecr get-login-password --region "${AWS_REGION}" |
        docker login --username AWS --password-stdin
        "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      # Tag the already-built, already-tested local image with both the
      # floating `latest` tag and the immutable source commit SHA, so a
      # deployment can always be traced back to exact code.
      - ': ${CODEBUILD_RESOLVED_SOURCE_VERSION:?CODEBUILD_RESOLVED_SOURCE_VERSION is not set}'
      - ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${IMAGE_REPO}"
      - docker tag "${IMAGE_REPO}:${IMAGE_TAG}" "${ECR_URI}:${IMAGE_TAG}"
      - docker tag "${IMAGE_REPO}:${IMAGE_TAG}" "${ECR_URI}:${CODEBUILD_RESOLVED_SOURCE_VERSION}"
      - echo "Pushing ${ECR_URI}:${IMAGE_TAG} and ${ECR_URI}:${CODEBUILD_RESOLVED_SOURCE_VERSION}..."
      - docker push "${ECR_URI}:${IMAGE_TAG}"
      - docker push "${ECR_URI}:${CODEBUILD_RESOLVED_SOURCE_VERSION}"

      # ---- Lambda deployment: update function to the immutable commit image. ----
      - 'echo "Updating Lambda function pdf-compressor..."'
      - >-
        aws lambda update-function-code
        --function-name pdf-compressor
        --image-uri "${ECR_URI}:${CODEBUILD_RESOLVED_SOURCE_VERSION}"
        --region "${AWS_REGION}"
      - 'echo "Waiting for Lambda image update to complete..."'
      - aws lambda wait function-updated --function-name pdf-compressor --region "${AWS_REGION}"
      - 'echo "Lambda deployment completed successfully."'
      - 'echo "Backend CI/CD complete: tests passed, image pushed to ECR, Lambda updated."'
